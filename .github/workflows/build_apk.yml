name: Flutter Insignia APK Build

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'
          cache: true

      # Android klasörünü Flutter'ın güncel motoruyla sıfırdan ve uyumlu olarak üretir
      - name: Recreate Android Project Scaffolding
        run: |
          flutter create --platforms=android --org com.insignia .

      # Bluetooth ve Konum izinlerini üretilen AndroidManifest.xml'e enjekte eder
      - name: Configure Android Manifest Permissions
        run: |
          sed -i '/<application/i \
          <uses-permission android:name="android.permission.BLUETOOTH" />\
          <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />\
          <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />\
          <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\
          <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\
          <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\
          <uses-permission android:name="android.permission.INTERNET" />' android/app/src/main/AndroidManifest.xml

      # compileSdk ve minSdk ayarlarını garantiye alır
      - name: Set SDK Versions
        run: |
          sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle* || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle* || true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Insignia-Vites-Asistani-APK
          path: build/app/outputs/flutter-apk/app-release.apk
